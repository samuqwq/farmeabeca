<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Colegio - FarmeaBeca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="d-flex">
        <!-- Sidebar Profesional -->
        <div class="sidebar p-4" style="width: 280px; min-height: 100vh;">
            <div class="d-flex align-items-center mb-5">
                <i class="fas fa-school fa-2x text-primary me-3"></i>
                <h4 class="fw-bold mb-0">FarmeaBeca</h4>
            </div>
            <ul class="nav flex-column gap-2">
                <li><a href="#" class="nav-link active px-3 py-3"><i class="fas fa-home me-2"></i>Dashboard</a></li>
                <li><a href="#" class="nav-link px-3 py-3"><i class="fas fa-users me-2"></i>Alumnos</a></li>
                <li><a href="misiones.html" class="nav-link px-3 py-3"><i class="fas fa-trophy me-2"></i>Misiones</a></li>
                <li><a href="suscripcion.html" class="nav-link px-3 py-3"><i class="fas fa-crown me-2"></i>Suscripción</a></li>
                <li><a href="../index.html" class="nav-link px-3 py-3"><i class="fas fa-arrow-left me-2"></i>Volver al Inicio</a></li>
            </ul>
            <hr class="my-4">
            <button onclick="logout()" class="btn btn-outline-danger w-100 py-3 rounded-pill">
                <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
            </button>
        </div>

        <!-- Contenido Principal -->
        <div class="flex-grow-1 p-5">
            <div class="d-flex justify-content-between align-items-center mb-5">
                <h1 class="fw-bold" id="colegioTitle">Dashboard Colegio</h1>
                <span id="colegioName" class="badge bg-primary fs-5 px-4 py-3 rounded-pill"></span>
            </div>

            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card h-100 text-white bg-primary">
                        <div class="card-body p-4">
                            <h5>Total Alumnos</h5>
                            <h2 id="totalAlumnos" class="display-4 fw-bold">12</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card h-100 text-white bg-success">
                        <div class="card-body p-4">
                            <h5>FBP Totales</h5>
                            <h2 id="totalFBP" class="display-4 fw-bold">2450</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card h-100 text-white bg-warning">
                        <div class="card-body p-4">
                            <h5>Plan Actual</h5>
                            <h2 id="planActual" class="display-4 fw-bold">Premium</h2>
                        </div>
                    </div>
                </div>

                <!-- Tabla de alumnos -->
                <div class="col-12">
                    <h5 class="mb-3">Alumnos registrados</h5>
                    <div class="card">
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover mb-0" id="tablaAlumnos">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Nombre</th>
                                            <th>RUT</th>
                                            <th class="text-end">FBP</th>
                                        </tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/dashboard.js"></script>
</body>
</html>
