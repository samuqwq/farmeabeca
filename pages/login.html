<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - FarmeaBeca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-light">

    <!-- Navbar consistente -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="../index.html">
                <i class="fas fa-graduation-cap me-2"></i>FarmeaBeca
            </a>
        </div>
    </nav>

    <div class="container py-5 mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <div class="text-center mb-5">
                            <i class="fas fa-graduation-cap fa-4x text-primary mb-3"></i>
                            <h2 class="fw-bold">Iniciar Sesión</h2>
                            <p class="text-muted">Bienvenido de vuelta a FarmeaBeca</p>
                        </div>

                        <form id="loginForm">
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Correo o RUT / Serie Institucional</label>
                                <input type="text" id="loginIdentifier" class="form-control form-control-lg" placeholder="ej: 12345678-5 o nombre@colegio.cl" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Contraseña</label>
                                <input type="password" id="loginPassword" class="form-control form-control-lg" value="123456" required>
                                <small class="text-muted">Demo: cualquier contraseña sirve</small>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 py-3 rounded-pill fw-semibold">Iniciar Sesión</button>
                        </form>

                        <div class="text-center mt-4">
                            <a href="registro.html" class="text-decoration-none">¿No tienes cuenta? Regístrate gratis</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/auth.js"></script>
</body>
</html>
