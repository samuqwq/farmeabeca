<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apoyo Psicológico - FarmeaBeca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .chat-container { height: 65vh; overflow-y: auto; background: #f0f7f0; border-radius: 20px; padding: 20px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-4" href="../index.html">
                <i class="fas fa-graduation-cap me-2"></i>FarmeaBeca
            </a>
            <div class="d-flex align-items-center gap-3">
                <span id="userGreeting" class="text-white fw-semibold d-none d-md-inline"></span>
                <a href="dashboard-alumno.html" class="btn btn-light btn-sm rounded-pill">← Dashboard</a>
                <button onclick="logout()" class="btn btn-outline-light btn-sm rounded-pill">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </button>
            </div>
        </div>
    </nav>

    <div class="container py-5 mt-5">
        <h1 class="fw-bold mb-4">Apoyo Psicológico</h1>
        <div class="card shadow-lg border-0">
            <div id="chatContainer" class="chat-container"></div>
            <div class="card-footer p-3">
                <form id="chatForm" class="d-flex gap-2">
                    <input type="text" id="chatInput" class="form-control form-control-lg rounded-pill" placeholder="Escribe tu mensaje..." autocomplete="off">
                    <button type="submit" class="btn btn-primary btn-lg rounded-pill px-4">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>

        <button onclick="solicitarAyudaProfesional()" class="btn btn-success btn-lg position-fixed bottom-0 end-0 m-4 shadow-lg rounded-circle" style="width: 70px; height: 70px;">
            <i class="fas fa-hand-holding-heart fa-2x"></i>
        </button>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="modalAyuda" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Solicitar Ayuda Profesional</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="modalNombre" class="form-control mb-3" readonly>
                    <textarea id="modalMensaje" class="form-control" rows="4" placeholder="Describe cómo te sientes..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button onclick="enviarSolicitudProfesional()" class="btn btn-success">Enviar Solicitud</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/dashboard.js"></script>
    <script src="../assets/js/psicologia.js"></script>
</body>
</html>
