<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - FarmeaBeca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-light">

    <!-- Navbar consistente -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="../index.html">
                <i class="fas fa-graduation-cap me-2"></i>FarmeaBeca
            </a>
        </div>
    </nav>

    <div class="container py-5 mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-10">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="fas fa-graduation-cap fa-4x text-primary mb-3"></i>
                            <h2 class="fw-bold">Crear Cuenta</h2>
                        </div>

                        <ul class="nav nav-pills nav-justified mb-4 bg-light rounded-pill p-1" id="tipoTabs">
                            <li class="nav-item">
                                <button class="nav-link active rounded-pill" id="tab-alumno" data-tipo="alumno">Soy Estudiante</button>
                            </li>
                            <li class="nav-item">
                                <button class="nav-link rounded-pill" id="tab-colegio" data-tipo="colegio">Soy Colegio</button>
                            </li>
                        </ul>

                        <form id="registroForm">
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Nombre completo / Nombre del Instituto</label>
                                <input type="text" id="nombre" class="form-control form-control-lg" required>
                            </div>

                            <!-- Alumno -->
                            <div id="campo-alumno">
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">RUT (con guión)</label>
                                    <input type="text" id="rut" class="form-control form-control-lg" placeholder="12345678-9" maxlength="10">
                                    <div id="rutError" class="text-danger small mt-1"></div>
                                </div>
                            </div>

                            <!-- Colegio -->
                            <div id="campo-colegio" class="d-none">
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Número de Serie Institucional</label>
                                    <input type="text" id="serie" class="form-control form-control-lg" placeholder="Mínimo 6 caracteres">
                                    <div id="serieError" class="text-danger small mt-1"></div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 py-3 rounded-pill fw-semibold mt-2">Registrarme</button>
                        </form>

                        <div class="text-center mt-4">
                            <a href="login.html" class="text-decoration-none">¿Ya tienes cuenta? Inicia sesión</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/auth.js"></script>
</body>
</html>
